[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "performance-report-backend"
version = "0.1.0"
description = "Operations agent backend for WeCom and enterprise data sources"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
  "wecom-aibot-sdk-python>=0.1.6,<1",
  "mcp>=1.9,<2",
  "openpyxl>=3.1,<4",
  "pywin32>=306; sys_platform == 'win32'",
  "fastembed>=0.7,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
hermes-welding-mcp = "hermes_mcp_gateway.server:main"
hermes-welding-mcp-welding = "hermes_mcp_gateway.scoped_entrypoints:main_welding"
hermes-welding-mcp-painting = "hermes_mcp_gateway.scoped_entrypoints:main_painting"
welding-business-api = "app.deploy:main"
welding-business-scheduled-reports = "app.workshop.scheduled_reports:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
include = ["app*", "hermes_mcp_gateway*"]
